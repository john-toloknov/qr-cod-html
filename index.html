<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер оборудования</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 0; 
            padding: 15px; 
            background: #17212b; 
            color: white; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 90vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        #reader { 
            width: 100%; 
            border-radius: 12px; 
            overflow: hidden; 
            background: #000;
        }
        .card {
            background: #212d3b;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .code-display {
            font-family: monospace;
            font-size: 18px;
            color: #52cbff;
            background: #2b5278;
            padding: 12px;
            border-radius: 8px;
            word-break: break-all;
            text-align: center;
        }
        label {
            font-size: 14px;
            color: #8ab4f8;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #3b4e63;
            background: #17212b;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
        }
        .btn {
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .main-btn { background-color: #27ae60; color: white; }
        .retry-btn { background-color: #c0392b; color: white; }
        .file-btn { background-color: #2980b9; color: white; }
        #file-input { display: none; }
        
        .step { display: none; }
        .step.active { display: flex; flex-direction: column; gap: 15px; }
        
        #success-screen {
            text-align: center;
            padding: 30px 10px;
            display: none;
        }
        #success-screen.active {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        .loader {
            font-size: 16px;
            color: #f1c40f;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ШАГ 1: Выбор типа оборудования и сканирование -->
        <div id="step-scan" class="step active">
            <h3 style="text-align: center; margin: 0;">Выберите тип оборудования</h3>
            <div class="card">
                <label for="equipment-type">Что сканируем:</label>
                <select id="equipment-type">
                    <option value="router">Роутер</option>
                    <option value="stb">Приставка</option>
                </select>
            </div>
            <h3 style="text-align: center; margin: 0;">Наведите камеру на штрих-код</h3>
            <div id="reader"></div>
            <button class="btn file-btn" onclick="document.getElementById('file-input').click()">Загрузить фото из галереи 📁</button>
            <input type="file" id="file-input" accept="image/*" onchange="handleFile(event)">
        </div>

        <!-- ШАГ 2: Выбор сотрудника, монтажника и отправка -->
        <div id="step-form" class="step">
            <h3 style="text-align: center; margin: 0;">✅ Код успешно считан</h3>
            
            <div class="card">
                <label>Серийный номер:</label>
                <div class="code-display" id="scanned-code-text"></div>
                <button class="btn retry-btn" style="padding: 8px; font-size: 14px;" onclick="resetScanner()">Сканировать другой код 🔄</button>
            </div>

            <div class="card">
                <label for="given-by">Кто записывает (Кем выдан):</label>
                <select id="given-by">
                    <option value="Толокнов Евгений" selected>Толокнов Евгений</option>
                    <option value="Лоос Виктор">Лоос Виктор</option>
                    <option value="Стрижко Дмитрий">Стрижко Дмитрий</option>
                    <option value="Какалова Мария">Какалова Мария</option>
                </select>
            </div>

            <div class="card">
                <label for="installer">Кому выдан (Монтажник):</label>
                <select id="installer">
                    <option value="Курмангалиев Тимур Берикович,Бригада №1 (Темиртау)">Курмангалиев Тимур</option>
                    <option value="Стрижко Дмитрий Юрьевич,Бригада №3 (Темиртау)">Стрижко Дмитрий</option>
                    <option value="Новиков Иван Викторович,Бригада №4 (Темиртау)">Новиков Иван</option>
                    <option value="Лоос Виктор Геннадьевич,Бригада №5 (Темиртау)">Лоос Виктор</option>
                    <option value="Марчуков Андрей Артемович,Бригада №6 (Темиртау)">Марчуков Андрей</option>
                    <option value="Иванусь Аркадий Александрович,Бригада №7 (Темиртау)">Иванусь Аркадий</option>
                    <option value="Павленко Николай Александрович,Бригада №8 (Темиртау)">Павленко Николай</option>
                    <option value="Седухин Владимир Игоревич,Бригада №9 (Темиртау)">Седухин Владимир</option>
                    <option value="Янковицкий Сергей Валериевич,Бригада №10 (Темиртау)">Янковицкий Сергей</option>
                    <option value="Тарыца Захар Васильевич,Бригада №11 (Темиртау)">Тарыца Захар</option>
                    <option value="Кайзер Павел Иванович,Бригада №12 (Темиртау)">Кайзер Павел</option>
                </select>
            </div>

            <button class="btn main-btn" id="submit-btn" onclick="sendDataToGoogleSheet()">Записать в таблицу 🚀</button>
            <div class="loader" id="loader-text">⏳ Запись в Google Таблицу...</div>
        </div>

        <!-- ЭКРАН УСПЕХА -->
        <div id="success-screen">
            <h2 style="color: #2ecc71; margin: 0;">Успешно записано! 🎉</h2>
            <p style="color: #ccc;">Оборудование закреплено за монтажником.</p>
            <button class="btn main-btn" onclick="resetScanner()">Сканировать следующее 📲</button>
        </div>

    </div>

    <!-- Скрытый iframe для бесшовной отправки POST-запроса без перезагрузки страницы -->
    <iframe name="hidden-iframe" id="hidden-iframe" style="display:none;"></iframe>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxINc6eOKp6cNkGxpPMj58WCSJSD6CpPxaSUo59Z2woVx4sMXK8UfDjLqOKuh-G07JBaw/exec";

        let currentCode = "";
        let html5QrCode = null;
        const zxingReader = new ZXing.BrowserMultiFormatReader();
        let isCameraRunning = false;

        async function startCamera() {
            if (isCameraRunning) return;
            document.getElementById('reader').innerHTML = '';
            html5QrCode = new Html5Qrcode("reader");

            try {
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 15, qrbox: { width: 280, height: 140 } },
                    (text) => {
                        currentCode = text;
                        if (navigator.vibrate) navigator.vibrate(50);
                        stopCameraAndShowForm();
                    }
                );
                isCameraRunning = true;
            } catch (err) {
                console.log("Ошибка запуска камеры:", err);
                isCameraRunning = false;
            }
        }

        async function stopCameraAndShowForm() {
            if (html5QrCode && isCameraRunning) {
                try {
                    await html5QrCode.stop();
                    await html5QrCode.clear();
                } catch (e) {}
                isCameraRunning = false;
            }
            showFormStep();
        }

        setTimeout(startCamera, 300);

        async function handleFile(e) {
            if (e.target.files && e.target.files.length > 0) {
                const file = e.target.files[0];
                if (html5QrCode && isCameraRunning) {
                    try { 
                        await html5QrCode.stop(); 
                        await html5QrCode.clear();
                    } catch(e) {}
                    isCameraRunning = false;
                }

                const reader = new FileReader();
                reader.onload = async function (event) {
                    const img = new Image();
                    img.onload = async function () {
                        const canvas = document.createElement('canvas');
                        canvas.width = 1600;
                        canvas.height = img.height * (1600 / img.width);
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        try {
                            const result = await zxingReader.decodeFromImageUrl(canvas.toDataURL('image/jpeg', 0.95));
                            if (result) {
                                currentCode = result.getText();
                                showFormStep();
                                return;
                            }
                            throw new Error();
                        } catch (err) {
                            alert("Штрих-код не найден на фото. Попробуйте еще раз.");
                            resetScanner();
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function showFormStep() {
            document.getElementById('step-scan').classList.remove('active');
            document.getElementById('success-screen').classList.remove('active');
            document.getElementById('scanned-code-text').textContent = currentCode;
            document.getElementById('step-form').classList.add('active');
        }

        async function resetScanner() {
            currentCode = "";
            if (html5QrCode && isCameraRunning) {
                try {
                    await html5QrCode.stop();
                    await html5QrCode.clear();
                } catch (e) {}
                isCameraRunning = false;
            }
            
            document.getElementById('success-screen').classList.remove('active');
            document.getElementById('step-form').classList.remove('active');
            document.getElementById('step-scan').classList.add('active');
            document.getElementById('file-input').value = '';
            document.getElementById('submit-btn').style.display = 'block';
            document.getElementById('loader-text').style.display = 'none';
            
            setTimeout(() => {
                startCamera();
            }, 500);
        }

        function sendDataToGoogleSheet() {
            if (!currentCode) {
                alert("Ошибка: серийный номер не найден!");
                return;
            }

            const equipmentType = document.getElementById('equipment-type').value;
            const installer = document.getElementById('installer').value;
            const givenBy = document.getElementById('given-by').value;
            
            const submitBtn = document.getElementById('submit-btn');
            const loaderText = document.getElementById('loader-text');

            submitBtn.style.display = 'none';
            loaderText.style.display = 'block';

            // Создаем динамическую форму для отправки POST-запроса без CORS-ошибок
            const form = document.createElement('form');
            form.action = GOOGLE_SCRIPT_URL;
            form.method = 'POST';
            form.target = 'hidden-iframe'; // Отправка в скрытый iframe

            const fields = {
                type: equipmentType,
                serialNumber: currentCode,
                installer: installer,
                givenBy: givenBy
            };

            for (const key in fields) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = fields[key];
                form.appendChild(input);
            }

            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);

            // Показываем экран успеха через секунду
            setTimeout(() => {
                document.getElementById('step-form').classList.remove('active');
                document.getElementById('success-screen').classList.add('active');
            }, 800);
        }
    </script>
</body>
</html>
