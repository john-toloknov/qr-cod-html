<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет роутеров и приставок</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 0; 
            padding: 15px; 
            background: #17212b; 
            color: white; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 90vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        #reader { 
            width: 100%; 
            border-radius: 12px; 
            overflow: hidden; 
            background: #000;
        }
        .card {
            background: #212d3b;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .code-display {
            font-family: monospace;
            font-size: 18px;
            color: #52cbff;
            background: #2b5278;
            padding: 12px;
            border-radius: 8px;
            word-break: break-all;
            text-align: center;
        }
        label {
            font-size: 14px;
            color: #8ab4f8;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #3b4e63;
            background: #17212b;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .main-btn { background-color: #27ae60; color: white; }
        .retry-btn { background-color: #c0392b; color: white; }
        .file-btn { background-color: #2980b9; color: white; }
        #file-input { display: none; }
        
        /* Управление видимостью шагов */
        .step { display: none; }
        .step.active { display: flex; flex-direction: column; gap: 15px; }
    </style>
</head>
<body>
    <div class="container">

        <!-- ШАГ 1: Сканирование -->
        <div id="step-scan" class="step active">
            <h3 style="text-align: center; margin: 0;">Наведите камеру на штрих-код</h3>
            <div id="reader"></div>
            <button class="btn file-btn" onclick="document.getElementById('file-input').click()">Загрузить фото из галереи 📁</button>
            <input type="file" id="file-input" accept="image/*" onchange="handleFile(event)">
        </div>

        <!-- ШАГ 2: Подтверждение кода и заполнение остальной формы -->
        <div id="step-form" class="step">
            <h3 style="text-align: center; margin: 0;">✅ Код успешно считан</h3>
            
            <div class="card">
                <label>Серийный номер:</label>
                <div class="code-display" id="scanned-code-text"></div>
                <button class="btn retry-btn" style="padding: 8px; font-size: 14px;" onclick="resetScanner()">Сканировать другой код 🔄</button>
            </div>

            <div class="card">
                <label for="assignee">Кем выдан / Ответственный:</label>
                <select id="assignee">
                    <option value="Толокнов">Толокнов</option>
                    <option value="Лоос">Лоос</option>
                    <option value="Стрижко">Стрижко</option>
                    <option value="Какалова">Какалова</option>
                </select>

                <label for="issue-date">Дата выдачи:</label>
                <input type="date" id="issue-date">
            </div>

            <button class="btn main-btn" onclick="submitAllData()">Записать роутер 🚀</button>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let currentCode = "";
        const html5QrCode = new Html5Qrcode("reader");
        const zxingReader = new ZXing.BrowserMultiFormatReader();
        let isCameraRunning = false;

        // Автоматически ставим текущую дату в поле даты
        document.getElementById('issue-date').valueAsDate = new Date();

        function startCamera() {
            if (isCameraRunning) return;
            
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 15, qrbox: { width: 280, height: 140 } },
                (text) => {
                    currentCode = text;
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    stopCameraAndShowForm();
                }
            ).then(() => {
                isCameraRunning = true;
            }).catch((err) => {
                console.log("Ошибка камеры:", err);
            });
        }

        function stopCameraAndShowForm() {
            if (isCameraRunning) {
                html5QrCode.stop().then(() => {
                    isCameraRunning = false;
                    showFormStep();
                }).catch(() => {
                    isCameraRunning = false;
                    showFormStep();
                });
            } else {
                showFormStep();
            }
        }

        startCamera();

        // Обработка загрузки файла фото
        async function handleFile(e) {
            if (e.target.files && e.target.files.length > 0) {
                const file = e.target.files[0];
                if (isCameraRunning) {
                    try { await html5QrCode.stop(); isCameraRunning = false; } catch(e) {}
                }

                const reader = new FileReader();
                reader.onload = async function (event) {
                    const img = new Image();
                    img.onload = async function () {
                        const canvas = document.createElement('canvas');
                        canvas.width = 1600;
                        canvas.height = img.height * (1600 / img.width);
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        try {
                            const result = await zxingReader.decodeFromImageUrl(canvas.toDataURL('image/jpeg', 0.95));
                            if (result) {
                                currentCode = result.text;
                                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                                showFormStep();
                                return;
                            }
                            throw new Error();
                        } catch (err) {
                            alert("Штрих-код не найден на фото. Попробуйте еще раз.");
                            resetScanner();
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function showFormStep() {
            document.getElementById('step-scan').classList.remove('active');
            document.getElementById('scanned-code-text').textContent = currentCode;
            document.getElementById('step-form').classList.add('active');
        }

        function resetScanner() {
            currentCode = "";
            document.getElementById('step-form').classList.remove('active');
            document.getElementById('step-scan').classList.add('active');
            document.getElementById('file-input').value = '';
            startCamera();
        }

        // Финальная отправка всех собранных данных в PuzzleBot
        function submitAllData() {
            const assignee = document.getElementById('assignee').value;
            const issueDate = document.getElementById('issue-date').value;

            // Формируем общую строку, которую передадим в бот
            // Можно передать в формате JSON или текстом через разделитель, чтобы бот распарсил
            const resultData = `СН: ${currentCode} | Кем выдан: ${assignee} | Дата: ${issueDate}`;

            if (tg.sendData) {
                tg.sendData(resultData);
            }

            setTimeout(() => {
                tg.close();
            }, 100);
        }
    </script>
</body>
</html>
